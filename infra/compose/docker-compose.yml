name: novex

services:
  postgres:
    image: postgres:16-alpine
    container_name: novex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c max_connections=150
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports: DB accessible only inside compose network

  redis:
    image: redis:7-alpine
    container_name: novex-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2022-10-24T18-35-07Z
    container_name: novex-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-shot: runs alembic upgrade head then exits (code is baked into image).
  # backend waits for service_completed_successfully.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - path: ../env/backend.env
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: novex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      carrier-gateway:
        condition: service_healthy
    working_dir: /app
    env_file:
      - path: ../env/backend.env
        required: false
    environment:
      PROJECT_NAME: Novex API
      APP_VERSION: 0.1.0
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      API_V1_PREFIX: /api/v1
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${DOMAIN}
      MINIO_PUBLIC_SECURE: "true"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: novex-prod
      MINIO_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      BACKEND_CORS_ORIGINS: '["https://${DOMAIN}"]'
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Novex}
      SMTP_TLS: ${SMTP_TLS:-true}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID}
      KASPI_API_KEY: ${KASPI_API_KEY}
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET}
      KASPI_API_URL: ${KASPI_API_URL:-https://api.kaspi.kz/merchant}
      FRONTEND_URL: https://${DOMAIN}
      BACKEND_URL: https://${DOMAIN}
      CARRIER_GATEWAY_URL: http://carrier-gateway:8100
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CSE_LOGIN: ${CSE_LOGIN:-}
      CSE_PASSWORD: ${CSE_PASSWORD:-}
      CSE_API_URL: ${CSE_API_URL:-http://web.cse.ru/1c/ws/Web1C.1cws}
      EXLINE_EXTRA: ${EXLINE_EXTRA:-}
      EXLINE_LOGIN: ${EXLINE_LOGIN:-}
      EXLINE_PASSWORD: ${EXLINE_PASSWORD:-}
      EXLINE_API_URL: ${EXLINE_API_URL:-https://home.courierexe.ru/api/}
    # CMD is defined in Dockerfile: uvicorn --workers 4 (no --reload)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: novex-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    working_dir: /app
    env_file:
      - path: ../env/worker.env
        required: false
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${DOMAIN}
      MINIO_PUBLIC_SECURE: "true"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_BUCKET: novex-prod
      MINIO_SECURE: "false"
      CARRIER_GATEWAY_URL: http://carrier-gateway:8100
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CSE_LOGIN: ${CSE_LOGIN:-}
      CSE_PASSWORD: ${CSE_PASSWORD:-}
      CSE_API_URL: ${CSE_API_URL:-http://web.cse.ru/1c/ws/Web1C.1cws}
      # Email consumer lives in this container — needs SMTP creds to
      # actually send. Without them send_email() logs "SMTP не настроен"
      # and returns silently while the consumer still logs "sent".
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Novex}
      SMTP_TLS: ${SMTP_TLS:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).get('worker:alive') or exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    # CMD is defined in Dockerfile: python -m workers.main

  carrier-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    container_name: novex-carrier-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # No ports exposed — internal Docker network only

  tracking-poller:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: novex-tracking-poller
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      carrier-gateway:
        condition: service_healthy
    working_dir: /app
    env_file:
      - path: ../env/worker.env
        required: false
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CARRIER_GATEWAY_URL: http://carrier-gateway:8100
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CSE_LOGIN: ${CSE_LOGIN:-}
      CSE_PASSWORD: ${CSE_PASSWORD:-}
      CSE_API_URL: ${CSE_API_URL:-http://web.cse.ru/1c/ws/Web1C.1cws}
    command: ["python", "-m", "workers.tracking_poller"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).get('tracking_poller:alive') or exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      # NEXT_PUBLIC_* переменные вшиваются в клиентский бандл на build-time.
      # После правки .env — пересобрать: docker compose build frontend
      args:
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@novex.kz}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-+7 (727) 000-00-00}
        NEXT_PUBLIC_PARTNERS_EMAIL: ${NEXT_PUBLIC_PARTNERS_EMAIL:-partners@novex.kz}
        NEXT_PUBLIC_OFFICE_ADDRESS: ${NEXT_PUBLIC_OFFICE_ADDRESS:-Алматы, Казахстан}
    container_name: novex-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: Novex
      # Used by Next.js rewrites when the standalone server proxies /api/*
      BACKEND_URL: http://backend:8000
    # CMD is defined in Dockerfile: node server.js (Next.js standalone)

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
    container_name: novex-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt
      - ./nginx-prod.conf:/etc/nginx/templates/default.conf.template:ro

  certbot:
    image: certbot/certbot:latest
    container_name: novex-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    profiles:
      - tls

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_www:
  certbot_certs:
