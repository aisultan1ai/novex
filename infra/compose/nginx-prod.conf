resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP → HTTPS redirect: novex.kz ───────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: novex.kz ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow uploads for payment proof photos etc.
    client_max_body_size 20m;

    proxy_http_version 1.1;

    set $backend  "backend:8000";
    set $frontend "frontend:3000";
    set $minio    "minio:9000";

    # MinIO S3 proxy — serves presigned URLs from the browser.
    # Bucket name in the URL path must match MINIO_BUCKET (novex-prod).
    location /novex-prod/ {
        proxy_pass         http://$minio;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Internal MinIO proxy for X-Accel-Redirect (waybill/label downloads).
    # Only reachable via internal redirect from backend, never from the browser.
    # Backend sends X-Accel-Redirect: /internal-storage/<bucket>/<object>?<presign>
    # and nginx fetches the object from MinIO and streams it back.
    location /internal-storage/ {
        internal;
        # Strip the /internal-storage prefix — pass path directly to MinIO.
        rewrite ^/internal-storage/(.*) /$1 break;
        proxy_pass         http://$minio;
        proxy_set_header   Host              $host;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://$frontend;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── HTTP → HTTPS redirect: admin.novex.kz ─────────────────────────────────────
server {
    listen 80;
    server_name admin.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: admin.novex.kz ─────────────────────────────────────────────────────
#
# Доступ ограничен по IP — укажите ваши реальные IP-адреса ниже.
# Получить свой IP: curl ifconfig.me
#
server {
    listen 443 ssl;
    server_name admin.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;

    set $backend  "backend:8000";
    set $frontend "frontend:3000";

    # ── IP-ограничение (раскомментируйте и заполните свои IP) ────────────────
    # allow 1.2.3.4;     # офис
    # allow 5.6.7.8;     # ваш домашний IP
    # deny all;
    # ─────────────────────────────────────────────────────────────────────────

    location /api/ {
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://$frontend;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
