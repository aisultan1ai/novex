# resolver enables dynamic DNS re-resolution via variables (avoids stale IPs after container restarts)
resolver 127.0.0.11 valid=10s ipv6=off;

# ── Клиентский домен: novex.kz ────────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    proxy_http_version 1.1;

    set $backend  "backend:8000";
    set $frontend "frontend:3000";

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/ {
        proxy_pass       http://$frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://$frontend;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── Админ поддомен: admin.novex.kz ───────────────────────────────────────────
#
# Доступ ограничен по IP — укажите ваши реальные IP-адреса ниже.
# Получить свой IP: curl ifconfig.me
#
