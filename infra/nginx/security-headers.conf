# Security headers for pages, static files and MinIO objects served through nginx.
#
# NOT included in `location /api/`: the backend already sets its own (stricter)
# set there (app/core/middleware.py) and duplicates with different values would
# make browsers ignore both.
#
# `add_header` is not inherited into a location that has its own add_header, so
# this file is `include`d inside each location that needs it.
#
# HSTS mirrors the backend value on purpose: browsers store the LAST HSTS header
# they see per host, so two different max-age values would keep overwriting
# each other.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
