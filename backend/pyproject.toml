[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novex-backend"
version = "0.1.0"
description = "Novex backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg2-binary>=2.9,<3.0",
    "asyncpg>=0.29,<1.0",
    "cryptography>=43.0,<45.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "PyJWT>=2.8,<3.0",
    "email-validator>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "slowapi>=0.1.9,<1.0",
    "limits[redis]>=3.6,<4.0",
    "minio>=7.2,<8.0",
    "fpdf2>=2.7,<3.0",
    "weasyprint>=63.0,<70.0",
    "openpyxl>=3.1,<4.0",
    "sentry-sdk[fastapi]>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff>=0.6,<1.0",
    "black>=26.0,<27.0",
    "mypy>=1.10,<2.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*", "integrations*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses Depends() as default arg — legitimate pattern.
# UP046: Generic[T] in Pydantic BaseModel subclass — new syntax breaks Pydantic v2.
# B904: pre-existing raise-without-from in HTTP error handlers — not a regression risk.
ignore = ["B008", "UP046", "B904"]

[tool.ruff.lint.per-file-ignores]
# HTML email templates contain inline styles that cannot be line-wrapped.
"app/modules/identity/service.py" = ["E501"]
"app/core/email_templates.py" = ["E501"]
# Alembic migration files contain SQL inside f-strings that cannot be line-wrapped.
"migrations/versions/*.py" = ["E501"]
# workers/main.py imports ORM models after sentinel constants (intentional ordering).
"workers/main.py" = ["E402"]
# One-off scripts use sys.path manipulation before imports.
"scripts/*.py" = ["E402", "E501"]
# Carrier tariff engine contains static data dicts with long note strings.
"app/modules/carriers/tariff_engine.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# Allow untyped third-party libs (FastAPI, SQLAlchemy stubs are partial)
ignore_missing_imports = true
# Check function bodies even without annotations
check_untyped_defs = true
# Namespace packages are now proper packages — explicit bases not needed
explicit_package_bases = false
# Exclude venv, migrations (auto-generated), and egg-info
exclude = [
    "\\.venv",
    "migrations/",
    "novex_backend\\.egg-info",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"